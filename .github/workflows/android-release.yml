name: Android Play release bundle
on:
  pull_request:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build unsigned production artifacts
        run: gradle -p android-app testReleaseUnitTest lintRelease bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release-reports
          path: android-app/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: myeongjak-play-unsigned
          path: |
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
