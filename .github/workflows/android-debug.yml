name: Android narration checks
on:
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - "client/src/lib/readerNativeAudio*"
      - "client/src/lib/readerAudioText.ts"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and APK build
        run: gradle -p android-app testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify screen-off recovery, pauses, and a 12-minute queue
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p android-app connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-narration-test-results
          path: |
            android-app/app/build/reports/
            android-app/app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        with:
          name: myeongjak-android-screen-off
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
