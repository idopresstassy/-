name: Android money MP3 regression
on:
  pull_request:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android-money-regression.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  money-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the installed player with real Money fixtures
        run: gradle -p android-app assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p android-app connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.myeongjak.library.MoneyAudioTest,com.myeongjak.library.NavigationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: money-mp3-api36-results
          path: |
            android-app/app/build/reports/
            android-app/app/build/outputs/androidTest-results/
