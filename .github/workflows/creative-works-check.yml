name: Creative works checks
on:
  push:
    branches: [feature/member-creative-works-20261031]
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/creative-works-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
